<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jako Autopilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: app shell (sidebar + top bar) around white product cards, mirroring the reference product screens:
   Email inbox, Order Details with extracted fields and source document, AI confidence panel, Autopilot Cockpit.
   Single light theme by request. Logical properties so the whole shell mirrors for Hebrew (RTL). */
:root{
  --bg:#F5F5F3; --card:#FFFFFF; --card-2:#F9FAFB; --paper:#FFFDF6;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --faint:#9CA3AF; --line:#E5E7EB; --line-2:#F1F2F4;
  --primary:#20674F; --primary-deep:#154635; --primary-soft:#E6F0EB; --primary-text:#1B5A45;
  --green:#16A34A; --green-text:#15803D; --green-soft:#DCFCE7; --green-tint:#F0FDF4; --green-line:#86EFAC;
  --amber:#B45309; --amber-soft:#FEF3C7; --rose:#BE123C; --rose-soft:#FFE4E6; --slate:#475569; --slate-soft:#E2E8F0;
  --hand:#2A2A2A;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 8px 24px -16px rgba(17,24,39,.25);
  --pop-shadow:0 12px 32px -12px rgba(17,24,39,.3),0 2px 6px rgba(17,24,39,.08);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand-font:"Caveat","Segoe Script","Bradley Hand",cursive;
  color-scheme:light;
}
:root[dir="rtl"]{--font:"Heebo","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
svg{display:inline-block}
.ic{width:16px;height:16px;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.side{width:232px;flex:none;background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:14px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:30}
.logo{display:flex;align-items:center;padding:8px 8px 18px}
.logo img{height:30px;width:auto;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--card-2)}
.nav a.on{background:var(--primary-soft);color:var(--primary-text)}
.nav a .ic{color:var(--muted)}
.nav a.on .ic{color:var(--primary-text)}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.side-foot b{color:var(--ink-2);font-weight:600;font-size:12.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-inline-end:6px;vertical-align:1px}
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);height:52px;display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu{display:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);place-items:center;color:var(--ink-2)}
.crumb{font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.crumb span{color:var(--faint);font-weight:400}
.bar-r{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.demo{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
[dir="rtl"] .demo{letter-spacing:0}
.lang{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--card)}
.lang:hover{background:var(--card-2)}
.ap{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.spark{color:var(--primary)}
.switch{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none;border:0;padding:0;direction:ltr}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--primary)}.switch.on i{transform:translateX(16px)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-deep);color:#fff;font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1360px;width:100%;margin:0 auto}
@media (max-width:900px){
  .side{position:fixed;inset-inline-start:0;top:env(safe-area-inset-top,0px);transform:translateX(-100%);transition:transform .22s;box-shadow:var(--pop-shadow)}
  [dir="rtl"] .side{transform:translateX(100%)}
  .side.open,[dir="rtl"] .side.open{transform:none}
  .scrim.open{opacity:1;pointer-events:auto}
  .menu{display:grid}
  .demo{display:none}
}
@media (max-width:600px){.ap .ap-t{display:none}.bar-r{gap:10px}}

/* ---------- cards & primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.card-h h1{font-size:19px}
.card-h .ic{color:var(--muted)}
.card-pad{padding:0 20px 20px}
.tabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 0 11px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 20px 0}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.tile .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font-size:20px;font-weight:500;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .ic{width:15px;height:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-deep);border-color:var(--primary-deep)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--card-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;background:var(--card)}
.chip.c-poconf{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.c-poupd{background:var(--green-soft);color:var(--green-text);border-color:transparent}
.chip.c-so{background:var(--primary-soft);color:var(--primary-text);border-color:transparent}
.chip.c-inv{background:var(--slate-soft);color:var(--slate);border-color:transparent}
.chip.c-oth{background:var(--line-2);color:var(--ink-2);border-color:transparent}
.conf{display:inline-flex;align-items:center;border-radius:5px;padding:2px 7px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.conf.hi{background:var(--green-soft);color:var(--green-text)}
.conf.mid{background:var(--amber-soft);color:var(--amber)}
.conf.lo{background:var(--rose-soft);color:var(--rose)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--card-2);margin:16px 20px 0}
.seg button{padding:5px 11px;border-radius:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(17,24,39,.08)}
.toolbar{display:flex;gap:8px;align-items:center;padding:16px 20px 0;flex-wrap:wrap;position:relative}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:220px;max-width:100%;color:var(--faint);font-size:13px;background:var(--card)}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);font-size:13px;padding:0}
.search .ic{width:14px;height:14px;color:var(--faint)}
.dd{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12.5px;color:var(--ink-2);background:var(--card);font-weight:500}
.dd .ic{width:12px;height:12px;color:var(--muted)}
.dd.on{border-color:var(--primary);color:var(--primary-text)}
.catpop{position:absolute;top:calc(100% + 6px);inset-inline-start:20px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop-shadow);padding:10px;width:200px;display:flex;flex-direction:column;gap:6px}
.catpop .cp-h{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:500;padding:4px 4px 8px;border-bottom:1px solid var(--line-2);margin-bottom:2px}
.catpop .chip{justify-content:space-between;cursor:pointer;padding:6px 9px}
.catpop .chip .ic{width:11px;height:11px}
.catpop .chip:hover{filter:brightness(.97)}
.tbl-wrap{overflow-x:auto;padding:12px 20px 20px}
.tbl{width:100%;border-collapse:collapse;min-width:720px;font-size:13px}
.tbl th{text-align:start;font-size:12px;font-weight:500;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th .ic{width:11px;height:11px;vertical-align:-1px;margin-inline-start:4px;color:var(--faint)}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap;color:var(--ink-2)}
.tbl td.ell{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tbl td.date{color:var(--ink);font-variant-numeric:tabular-nums}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--card-2)}
.tbl tr:last-child td{border-bottom:0}
.cb{width:14px;height:14px;border:1px solid var(--line);border-radius:3px;display:inline-block;vertical-align:middle;background:var(--card)}
.src{display:inline-flex;align-items:center;gap:6px}
.src .ic{width:14px;height:14px;color:var(--muted)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:13px}
[dir="rtl"] .tbl td,[dir="rtl"] .rtbl td,[dir="rtl"] .lines td,[dir="rtl"] .ptab td{unicode-bidi:plaintext}

/* ---------- cockpit ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding:16px 20px 20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.flagbox{border:1px solid var(--line);border-radius:10px;min-width:0}
.flag-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;font-weight:500;flex-wrap:wrap}
.qcards{display:flex;flex-direction:column;gap:10px;padding:12px}
.qcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);transition:opacity .3s,transform .3s}
.qcard.out{opacity:0;transform:translateX(24px)}
.qc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qc-top .time{font-size:12px;color:var(--muted)}
.qc-id{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:10px;direction:ltr}
[dir="rtl"] .qc-id{text-align:right}
.qc-line{font-size:14px;color:var(--ink);margin-top:2px}
.qc-sub{font-size:12px;color:var(--faint);margin-top:4px}
.qc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.qc-foot .r{display:flex;gap:8px;align-items:center}
.auto-note{padding:10px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2)}
.auto-note b{color:var(--ink-2);font-weight:500}
.sub-h{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 0;font-weight:600;font-size:14.5px}
.sub-h span{font-size:12px;color:var(--muted);font-weight:400}
.chart{width:100%;height:auto;display:block;padding:8px 10px 10px;overflow:visible;direction:ltr}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line-2)}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.chart .pt{fill:var(--ink)}
.chart .lb{fill:var(--green-text);font-size:14px;font-weight:500}
.chart .lbb{fill:var(--green-soft)}
.chart .ax{fill:var(--muted);font-size:11px}
.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl th{text-align:start;font-size:12px;font-weight:500;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}
.rtbl td{padding:11px 8px;border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.rtbl tr:last-child td{border-bottom:0}
.rtbl .bar{display:inline-block;width:110px;height:5px;border-radius:3px;background:var(--line-2);vertical-align:middle;margin-inline-end:8px;overflow:hidden}
.rtbl .bar i{display:block;height:100%;background:var(--green)}
.audit{list-style:none;margin:0;padding:8px 20px 20px;display:flex;flex-direction:column}
.audit li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px;align-items:center}
.audit li:last-child{border-bottom:0}
.audit .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.audit .who{font-size:12px;color:var(--muted)}
.audit b{font-weight:500;color:var(--ink)}

/* ---------- order details ---------- */
.o-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500;padding:6px 0}
.back:hover{color:var(--ink)}
.back .ic{width:14px;height:14px}
[dir="rtl"] .back .ic{transform:scaleX(-1)}
.o-id{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:-.02em;flex-wrap:wrap}
.o-sub{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;box-shadow:var(--shadow);margin-inline-start:auto;cursor:pointer;color:var(--ink)}
.pill .spark{font-size:13px}
.pill:hover{border-color:var(--primary)}
.ogrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px;align-items:start;padding:16px 20px 20px}
.ogrid>*{min-width:0}
@media (max-width:980px){.ogrid{grid-template-columns:1fr}}
.form-h{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{position:relative;min-width:0}
.field label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.info{width:13px;height:13px;border:1px solid var(--faint);border-radius:50%;font-size:9px;font-style:normal;display:inline-grid;place-items:center;color:var(--faint);line-height:1}
.inp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--faint);min-height:36px;background:var(--card);overflow:hidden}
.inp .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[dir="rtl"] .inp .val{direction:ltr;text-align:right}
.field.ext .inp{border-color:var(--green-line);background:var(--green-tint);color:var(--ink-2);cursor:pointer}
.field.ext.warn .inp{border-color:var(--amber);background:var(--amber-soft)}
.field.hi .inp{box-shadow:0 0 0 3px var(--green-soft)}
.nb{width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.field.warn .nb{background:var(--amber)}
.chev{width:12px;height:12px;color:var(--muted);flex:none}
.inp input{border:0;background:transparent;outline:0;width:100%;color:var(--ink);font-size:13px;padding:0;direction:ltr}
.popover{position:absolute;top:calc(100% + 8px);inset-inline-start:0;z-index:12;width:min(320px,92vw);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop-shadow);padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:7px;color:var(--ink)}
.popover b{font-weight:600}
.popover .gchip{display:inline-block;background:var(--green-soft);color:var(--green-text);border-radius:5px;padding:1px 7px;font-weight:600;font-size:13px;direction:ltr}
.popover .gchip.mid{background:var(--amber-soft);color:var(--amber)}
.popover .pnote{display:flex;gap:8px;align-items:flex-start;background:var(--green-tint);border:1px solid var(--green-soft);color:var(--green-text);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:4px}
.popover .pnote.mid{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.popover .pnote .ic{width:15px;height:15px;margin-top:1px}
.field:last-child .popover,.field:nth-last-child(2) .popover{top:auto;bottom:calc(100% + 8px)}
.lines-wrap{overflow-x:auto;margin-top:4px;border:1px solid var(--line);border-radius:8px}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th{text-align:start;font-size:12px;font-weight:500;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--card-2);white-space:nowrap}
.lines td{padding:9px 10px;border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.lines td.wrap{white-space:normal;min-width:160px}
.lines tr:last-child td{border-bottom:0}
.lines td.hl{background:var(--amber-soft);color:var(--amber);font-weight:500}
.lines td.ok{color:var(--green-text)}
.lines td.bad{color:var(--rose);font-weight:600;background:var(--rose-soft)}
.lines tfoot td{font-weight:500;color:var(--ink);background:var(--card-2);white-space:normal}
.o-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:11px 13px;font-size:13px;margin-top:18px}
.banner .ic{width:16px;height:16px;margin-top:1px;flex:none}
.banner.ok{background:var(--green-tint);border:1px solid var(--green-soft);color:var(--green-text)}
.banner.ask{background:var(--amber-soft);color:var(--amber)}
.banner.esc{background:var(--rose-soft);color:var(--rose)}
.banner b{font-weight:600}
.ocol{display:flex;flex-direction:column;gap:16px;min-width:0}
.doc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);font-size:13px;font-weight:600;flex-wrap:wrap}
.doc-h span{font-size:12px;color:var(--muted);font-weight:400}
.ltr{direction:ltr;text-align:left}
.hand{background:var(--paper);padding:22px 20px 18px;font-family:var(--hand-font);font-size:22px;line-height:1.25;color:var(--hand);border-radius:0 0 12px 12px;background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--line) 60%,transparent) 31px 32px)}
.hb{position:relative;border:1.5px solid var(--green);border-radius:4px;padding:12px 12px 8px;margin:16px 4px 10px;cursor:pointer;transition:background .15s}
.hb:hover,.hb.hi{background:color-mix(in srgb,var(--green-soft) 60%,transparent)}
.hb p{margin:0}
.tag{position:absolute;top:-11px;left:-2px;font-family:var(--font);font-size:11px;font-weight:500;background:var(--green);color:#fff;padding:2px 7px;border-radius:3px;line-height:1.4;white-space:nowrap}
.pct{position:absolute;top:-11px;right:-2px;font-family:var(--font);font-size:11px;font-weight:600;background:var(--card);color:var(--green-text);border:1.5px solid var(--green);padding:1px 6px;border-radius:4px;line-height:1.4}
.hand-free{margin:10px 6px 0;font-size:21px}
.mail{padding:14px 16px}
.mail .hdr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.mail .hdr b{color:var(--ink-2);font-weight:500}
.mail .hdr span{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.mail .subj{font-weight:600;font-size:13.5px;margin:10px 0 6px}
.mail .body{color:var(--ink-2);display:flex;flex-direction:column;gap:8px;font-size:13px}
.att{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:var(--card-2)}
.att .ic{width:13px;height:13px;color:var(--rose)}
.paper{margin:14px 16px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-size:12px;box-shadow:0 6px 20px -14px rgba(0,0,0,.4)}
.paper .pt{font-weight:600;font-size:13px}
.paper .pm{color:var(--muted);margin-top:2px;display:flex;flex-direction:column;gap:1px;font-size:11.5px}
.ptab-wrap{overflow-x:auto;margin-top:10px}
.ptab{width:100%;border-collapse:collapse;font-size:11.5px}
.ptab th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px;font-size:11px;white-space:nowrap}
.ptab td{padding:6px;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptab td:nth-child(2){white-space:normal;min-width:120px}
.ptab td.hl{background:var(--amber-soft);color:var(--amber);font-weight:500}
.ptab tfoot td{border-bottom:0;font-weight:500;padding-top:8px;white-space:normal}
.thread{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.msg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}
.msg.me{border-color:var(--green-line);background:var(--green-tint)}
.msg .mh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.msg .mh b{color:var(--ink);font-weight:600}
.msg .mb{color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
/* confidence panel */
.cf{padding:16px 18px}
.cf .big{display:flex;align-items:baseline;gap:4px;line-height:1;direction:ltr;justify-content:flex-start}
[dir="rtl"] .cf .big{justify-content:flex-end}
.cf .score{font-size:46px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cf .of{font-size:22px;color:var(--muted);font-weight:400}
.cf .bar{height:6px;border-radius:3px;background:var(--green-soft);margin-top:12px;overflow:hidden}
.cf .bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s}
.cf .thr-l{font-size:13px;color:var(--ink-2);margin-top:8px}
.cf .thr-l b{font-weight:600;color:var(--ink)}
.cf hr{border:0;border-top:1px solid var(--line-2);margin:14px 0}
.cf .rows{display:flex;flex-direction:column;gap:9px}
.cf .r{display:grid;grid-template-columns:minmax(120px,160px) 1fr 30px;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.cf .r .bar{margin:0;height:4px}
.cf .r b{text-align:end;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.cf .r.low .bar i{background:var(--amber)}
.cf .thr-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2)}
.cf .thr-row b{font-weight:600;color:var(--ink)}
.cf input[type=range]{width:100%;accent-color:var(--primary);margin:10px 0 6px}
.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:10px}
.fchip{display:inline-block;border-radius:5px;padding:3px 8px;font-size:12.5px;font-weight:500}
.fchip.rose{background:var(--rose-soft);color:var(--rose)}
.fchip.amber{background:var(--amber-soft);color:var(--amber)}
.fchip.green{background:var(--green-soft);color:var(--green-text)}
/* ai emails + log */
.emails{display:flex;flex-direction:column;gap:12px;padding:16px 20px 20px}
.em{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;background:var(--card)}
.em.draft{border-color:var(--green-line);background:var(--green-tint)}
.em .eh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.em .eh .by{font-size:12px;color:var(--green-text);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.em .meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:12px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line-2);margin-bottom:10px}
.em .meta b{color:var(--ink-2);font-weight:500}
.em .meta span{min-width:0;overflow-wrap:anywhere;color:var(--ink);direction:ltr;text-align:left}
.em .ebody{color:var(--ink-2);display:flex;flex-direction:column;gap:8px;max-width:70ch;direction:ltr;text-align:left}
.em .ebtn{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.log{list-style:none;margin:0;padding:10px 20px 20px}
.log li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:9px 0 9px 14px;padding-inline-start:14px;padding-inline-end:0;border-inline-start:2px solid var(--line-2);position:relative;font-size:13px;color:var(--ink-2)}
.log li::before{content:"";position:absolute;inset-inline-start:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.log li.ai::before{background:var(--green)}
.log li.user::before{background:var(--primary)}
.log .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.log b{font-weight:500;color:var(--ink)}
/* settings */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.set-grid{grid-template-columns:1fr}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.bands{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.conn{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.conn:last-child{border-bottom:0}
.conn .ic{color:var(--muted)}
.conn span{margin-inline-start:auto;font-size:12px;color:var(--green-text);font-weight:500}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#F5F5F3;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;z-index:50;max-width:min(92vw,560px);text-align:center;pointer-events:none;box-shadow:var(--pop-shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  let d = `M${pts[0]}`;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1].split(','), [x1, y1] = pts[i].split(','); const cx = ((+x0) + (+x1)) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }

  });

  s.innerHTML = g;
}

  if (state.editing) $$('.field.ext .val', root).forEach(v => { v.outerHTML = `<input data-i="${v.dataset.i}" value="${v.textContent.replace(/"/g, '&quot;')}" aria-label="${t('Edit')}">`; });
  const fields = $$('.field.ext', root), boxes = $$('.hb', root);
  const link = (b, on) => { fields.filter(f => f.dataset.b === b).forEach(f => f.classList.toggle('hi', on)); boxes.filter(x => x.dataset.b === b).forEach(x => x.classList.toggle('hi', on)); };
  let openPop = null;
  const hidePop = () => { if (openPop) { const p = $('.popover', openPop); if (p) p.remove(); openPop = null; } };
  const showPop = f => { hidePop(); const i = f.dataset.i; const fd = i != null ? o.fields[+i] : null; const p = fd ? fd.pop : o.linesPop; if (!p) return; f.insertAdjacentHTML('beforeend', popHTML(p, fd && fd.warn)); openPop = f; };
  fields.forEach(f => {
    f.addEventListener('mouseenter', () => { if (!state.editing) showPop(f); link(f.dataset.b, true); });
    f.addEventListener('mouseleave', () => { hidePop(); link(f.dataset.b, false); });
    f.addEventListener('focus', () => { if (!state.editing) showPop(f); link(f.dataset.b, true); });
    f.addEventListener('blur', () => { hidePop(); link(f.dataset.b, false); });
    f.addEventListener('click', e => { if (state.editing || e.target.closest('.popover')) return; if (openPop === f) hidePop(); else showPop(f); });
  });
  boxes.forEach(x => {
    x.addEventListener('mouseenter', () => link(x.dataset.b, true));
    x.addEventListener('mouseleave', () => link(x.dataset.b, false));
    x.addEventListener('click', () => { const f = fields.find(f => f.dataset.b === x.dataset.b); if (f) { f.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block:'center'}); showPop(f); link(x.dataset.b, true); setTimeout(() => link(x.dataset.b, false), 1400); } });
  });
  const range = $('#cfRange', root);
  if (range) {
    range.addEventListener('input', e => { state.thr = +e.target.value; $('#cfThr', root).textContent = state.thr; $('#cfThr2', root).textContent = state.thr; $('#formula', root).innerHTML = formulaHTML(o); });
    range.addEventListener('change', () => openOrder(o.id, true));
  }
  $$('[data-send]', root).forEach(b => b.addEventListener('click', () => { const i = +b.dataset.send; state.sent[o.id + ':' + i] = tick(); toast(`<b>${tf('Sent to {to}.', {to:o.emails[i].to})}</b>`); addLog(o, tf('Maren sent the drafted email to {to}', {to:o.emails[i].to})); state.audit.unshift([now(), `${o.id} · ${tf('email sent to {to}', {to:o.emails[i].to})}`, who(), '—']); openOrder(o.id, true); }));
  $$('[data-editmail]', root).forEach(b => b.addEventListener('click', () => { const em = b.closest('.em'), body = $('.ebody', em); body.contentEditable = 'true'; body.focus(); b.textContent = t('Editing · click Send when done'); b.disabled = true; }));
}
function finish(o, act) {
  state.done[o.id] = act;
  state.audit.unshift(auditLine(o, act));
  addLog(o, `${t(act === 'approve' ? 'Maren approved' : 'Maren escalated')} · ${t(act === 'approve' ? o.actions.approve : o.actions.escalate)}`);
  toast(`<b>${tf(act === 'approve' ? '{id} approved.' : '{id} escalated.', {id:o.id})}</b> ${t(act === 'approve' ? o.actions.approve : o.actions.escalate)}`);
  openOrder(o.id, true);
}

      <div class="set-row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${t('Autopilot threshold')}</span><b id="setThrV">${state.thr}</b></div><input type="range" id="setThr" min="50" max="99" value="${state.thr}" style="width:100%;accent-color:var(--primary);margin-top:10px" aria-label="${t('Autopilot threshold')}">
        <div class="bands"><span class="fchip green">${tf('≥ {t} · Auto-execute', {t:state.thr})}</span><span class="fchip amber">${tf('50–{t} · Flag for review', {t:state.thr - 1})}</span><span class="fchip rose">${t('< 50 · Escalate').replace('<', '&lt;')}</span></div></div>
      <div class="set-row"><div>${t('Customer-facing emails')}<small>${t('Jako drafts, a person sends')}</small></div><button class="switch on" role="switch" aria-checked="true" aria-label="${t('Customer-facing emails')}"><i></i></button></div>
      <div class="set-row"><div>${t('Supplier emails')}<small>${t('Sent automatically above the threshold')}</small></div><button class="switch on" role="switch" aria-checked="true" aria-label="${t('Supplier emails')}"><i></i></button></div>
      <div class="set-row"><div>${t('Learn from edits')}<small>${t('Every correction becomes a rule for that counterparty')}</small></div><button class="switch on" role="switch" aria-checked="true" aria-label="${t('Learn from edits')}"><i></i></button></div>
    </div></div>
    <div class="card"><div class="card-h"><h1>${t('Connections')}</h1></div><div class="card-pad" style="padding-top:10px">
      ${[['erp','SAP S/4HANA','2110'],['inbox','Outlook','einkauf@, rechnungen@, orders@'],['inbox','Gmail','ordini@nordwerk-industrial.it'],['edi','EDI (AS2)','ORDERS, ORDRSP, DESADV, INVOIC'],['teams','Microsoft Teams','Procurement, Finance'],['suppliers','Supplier portals','Voss Logistik, Bavaria Fastener']].map(c => `<div class="conn">${I[c[0]]}<div>${t(c[1])}<small style="display:block;color:var(--muted);font-size:12px" dir="ltr">${c[2]}</small></div><span><i class="dot"></i>${t('Connected')}</span></div>`).join('')}
    </div></div>
  </div>`;
  $('#setAp', V.settings).addEventListener('click', () => setAp(!state.ap));
  const r = $('#setThr', V.settings);
  r.addEventListener('input', e => { state.thr = +e.target.value; $('#setThrV', V.settings).textContent = state.thr; });
  r.addEventListener('change', renderSettings);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSide(); const p = $('#catPop'); if (p) p.hidden = true; } });
applyLang();
go(location.hash.slice(1) || 'cockpit');
})();
</script>
